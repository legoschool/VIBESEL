<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선택 앞에서 행동 조절하기</title>
<style>
:root{--main:#7C3AED;--bg:#F5F3FF;--text:#1F2937;--dim:#6B7280;--ok:#10B981;--warn:#F59E0B;--bad:#EF4444;--think:#3B82F6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:16px}
.wrap{max-width:560px;margin:0 auto}
.screen{display:none}.screen.on{display:block}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(124,58,237,.08)}
h1{font-size:25px;color:var(--main);text-align:center;margin-bottom:6px}
h2{font-size:20px;color:var(--main);margin-bottom:10px}
h3{font-size:16px;margin-bottom:8px}
p.sub{text-align:center;color:var(--dim);font-size:15px;margin-bottom:12px}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-main{background:var(--main);color:#fff}
.btn-sub{background:#EDE9FE;color:var(--main)}
.btn-line{background:#fff;color:var(--dim);border:1px solid #E5E7EB;font-size:14px;padding:9px;width:auto;display:inline-block;margin-right:6px}
input,textarea{width:100%;padding:12px;border:1px solid #DDD6FE;border-radius:10px;font-size:15px;font-family:inherit;margin:6px 0 12px}
textarea{min-height:62px;resize:vertical}
label{font-size:15px;font-weight:700}
.scene{background:#FAFAFA;border-left:4px solid var(--main);border-radius:10px;padding:14px;font-size:15px;margin:10px 0}
.feel{font-size:15px;font-weight:700;color:var(--bad);margin:8px 0}
.urge{font-size:14px;color:var(--dim);margin-bottom:10px}
.choice{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:2px solid #E5E7EB;border-radius:12px;background:#fff;font-size:15px;font-family:inherit;cursor:pointer;line-height:1.6}
.choice:hover{border-color:var(--main);background:#FAF9FF}
.result{border-radius:12px;padding:14px;margin-top:10px;font-size:15px}
.result.positive{background:#ECFDF5;border:1px solid #A7F3D0}
.result.negative{background:#FEF2F2;border:1px solid #FECACA}
.result.neutral{background:#FFFBEB;border:1px solid #FDE68A}
.badge{display:inline-block;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;color:#fff;margin-bottom:8px}
.ack{font-size:14px;color:var(--dim);margin-top:8px}
.note{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:12px;padding:12px;font-size:14px;margin-top:12px}
.tally{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.tally div{flex:1;min-width:110px;text-align:center;border-radius:12px;padding:12px;background:#F9FAFB;border:1px solid #F3F4F6}
.tally b{display:block;font-size:26px}
.tally span{font-size:13px;color:var(--dim)}
.stat{display:flex;justify-content:space-around;text-align:center;margin:12px 0}
.stat b{display:block;font-size:30px;color:var(--main)}
.stat span{font-size:13px;color:var(--dim)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.bar i{display:block;height:16px;border-radius:4px;font-style:normal}
.row{border-bottom:1px solid #F3F4F6;padding:10px 0;font-size:14px}
.row b{color:var(--main)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.top{margin-bottom:10px}
.step{font-size:13px;color:var(--dim);text-align:right}
</style>
</head>
<body>
<div class="wrap">

  <!-- 1. 시작 -->
  <section class="screen on" id="s-start">
    <div class="card">
      <h1 id="t-title"></h1>
      <p class="sub" id="t-sub"></p>
      <p class="sub" id="t-meta"></p>
      <button class="btn btn-main" onclick="go('teacher')">방 만들기 (선생님)</button>
      <button class="btn btn-sub" onclick="go('student')">방 코드로 참여하기 (학생)</button>
      <button class="btn btn-sub" onclick="solo()">혼자 해보기</button>
      <div class="note">틀린 선택은 없습니다. 고른 뒤에 무슨 일이 생기는지 보는 활동입니다.</div>
      <p class="sub" id="db-state" style="font-size:13px;margin:10px 0 0">저장소 확인 중</p>
    </div>
  </section>

  <!-- 2. 방 입장 -->
  <section class="screen" id="s-join">
    <div class="card">
      <h2 id="join-title"></h2>
      <div id="join-teacher" style="display:none">
        <p class="sub">아래 방 코드를 칠판에 적어 주세요.</p>
        <h1 id="new-code" style="font-size:44px;letter-spacing:6px"></h1>
        <button class="btn btn-main" onclick="openDash()">대시보드 열기</button>
        <p class="sub" style="margin-top:18px">지난 시간에 만든 방을 다시 열려면</p>
        <input id="in-dash" inputmode="numeric" maxlength="6" placeholder="예: 482913">
        <button class="btn btn-sub" onclick="reopenDash()">그 방 대시보드 열기</button>
      </div>
      <div id="join-student" style="display:none">
        <label>방 코드 (6자리)</label>
        <input id="in-code" inputmode="numeric" maxlength="6" placeholder="예: 482913">
        <label>닉네임 (실명 말고)</label>
        <input id="in-nick" maxlength="10" placeholder="예: 파랑새7">
        <button class="btn btn-main" onclick="joinRoom()">들어가기</button>
      </div>
      <button class="btn btn-line" onclick="home()">처음으로</button>
    </div>
  </section>

  <!-- 3. 상황 -->
  <section class="screen" id="s-play">
    <div class="top"><button class="btn btn-line" onclick="home()">처음으로</button><span class="step" id="step-label"></span></div>
    <div class="card">
      <h2 id="sit-title"></h2>
      <div class="scene" id="sit-scene"></div>
      <div class="feel" id="sit-feel"></div>
      <div class="urge" id="sit-urge"></div>
      <div id="sit-choices"></div>
      <div id="sit-after"></div>
    </div>
  </section>

  <!-- 4. 마무리 -->
  <section class="screen" id="s-wrap">
    <div class="card">
      <h2>내 선택을 모아 보면</h2>
      <p class="sub" id="wrap-count"></p>
      <div class="tally" id="wrap-tally"></div>
      <div id="wrap-msg"></div>
      <h3 style="margin-top:16px">다음에 비슷한 일이 생기면</h3>
      <textarea id="my-plan" placeholder="예: 바로 소리치지 말고, 숨 세 번 쉬고 '나 지금 속상해'라고 말하기"></textarea>
      <button class="btn btn-main" onclick="submitPlan()">내 다짐 내기</button>
      <button class="btn btn-line" onclick="restart()">다시 해보기</button>
    </div>
  </section>

  <!-- 5. 완료 -->
  <section class="screen" id="s-done">
    <div class="card" style="text-align:center">
      <h2 id="done-title"></h2>
      <div id="done-body" style="text-align:left"></div>
      <button class="btn btn-sub" onclick="copyMine()">내 결과 복사하기</button>
      <button class="btn btn-line" onclick="restart()">다시 해보기</button>
      <button class="btn btn-line" onclick="home()">처음으로</button>
    </div>
  </section>

  <!-- 6. 교사 대시보드 -->
  <section class="screen" id="s-dash">
    <div class="card">
      <h2>교사 대시보드</h2>
      <p class="sub">방 코드 <b id="dash-code"></b></p>
      <div class="stat"><div><b id="n-join">0</b><span>참여</span></div><div><b id="n-done">0</b><span>다짐 제출</span></div></div>
      <h3>우리 반의 선택 유형</h3><div id="dash-bars"></div>
      <h3 style="margin-top:16px">제출한 다짐</h3><div id="dash-rows"></div>
      <button class="btn btn-sub" onclick="copyAll()">전체 결과 복사하기</button>
      <button class="btn btn-line" onclick="home()">처음으로</button>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

/* ═══════════════════════════════════════════════
   여기만 고치면 우리 반 앱이 됩니다
   ═══════════════════════════════════════════════ */
const CONFIG = {

    {

var 순서 = [], 현재 = 0, 유형수 = {}, 답함 = false;

function $(id){ return document.getElementById(id); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(function(){ t.classList.remove('on'); }, 1600); }

function go(name){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('on'); });
  if (name === 'teacher' || name === 'student'){
    $('s-join').classList.add('on');
    $('join-title').textContent = (name === 'teacher') ? '방 만들기' : '방 코드로 참여하기';
    $('join-teacher').style.display = (name === 'teacher') ? 'block' : 'none';
    $('join-student').style.display = (name === 'student') ? 'block' : 'none';
    if (name === 'teacher'){ 방코드 = String(Math.floor(Math.random()*900000+100000)); $('new-code').textContent = 방코드; }
    window.scrollTo(0,0); return;
  }
  var map = { start:'s-start', play:'s-play', wrap:'s-wrap', done:'s-done', dash:'s-dash' };
  $(map[name]).classList.add('on');
  window.scrollTo(0,0);
}
function home(){ go('start'); }

function 시작하기(){
  순서 = 상황목록.map(function(_, i){ return i; });
  if (CONFIG.섞기){
    for (var i = 순서.length - 1; i > 0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = 순서[i]; 순서[i] = 순서[j]; 순서[j] = t;
    }
  }
  순서 = 순서.slice(0, Math.max(1, Math.min(CONFIG.풀문항수, 상황목록.length)));
  현재 = 0; 유형수 = {};
  Object.keys(TYPE_LABELS).forEach(function(k){ 유형수[k] = 0; });
  drawSit();
  go('play');
}
function solo(){ 방코드 = ''; 닉네임 = '나'; 시작하기(); }
function restart(){ 시작하기(); }

async function joinRoom(){
  var c = $('in-code').value.trim(), n = $('in-nick').value.trim();
  if (!/^[0-9]{6}$/.test(c)) { toast('방 코드 6자리를 숫자로 입력해 주세요'); return; }
  if (!n) { toast('닉네임을 입력해 주세요'); return; }
  방코드 = c; 닉네임 = n;
  await save(c, n, { nick:n, joinedAt: Date.now() });
  시작하기();
}

/* 상황 풀기 */
function drawSit(){
  답함 = false;
  var s = 상황목록[순서[현재]];
  $('step-label').textContent = (현재+1) + ' / ' + 순서.length;
  $('sit-title').textContent = (s.emoji || '') + ' ' + s.title;
  $('sit-scene').innerHTML = s.scene;
  $('sit-feel').textContent = s.feeling || '';
  $('sit-urge').textContent = s.impulse ? ('마음속 목소리: ' + s.impulse) : '';
  $('sit-after').innerHTML = '';
  $('sit-choices').innerHTML = s.choices.map(function(c, i){
    return '<button class="choice" onclick="choose(' + i + ')">' + esc(c.text) + '</button>';
  }).join('');
}
function choose(i){
  if (답함) return;
  답함 = true;
  var s = 상황목록[순서[현재]];
  var c = s.choices[i];
  유형수[c.type] = (유형수[c.type] || 0) + 1;
  var T = TYPE_LABELS[c.type] || { emoji:'', label:c.type, color:'#6B7280' };
  $('sit-choices').innerHTML = '<div class="choice" style="border-color:' + T.color + ';background:#FAFAFA">' + esc(c.text) + '</div>';
  $('sit-after').innerHTML =
    '<div class="result ' + (c.preview || 'neutral') + '">' +
    '<span class="badge" style="background:' + T.color + '">' + T.emoji + ' ' + esc(T.label) + '</span>' +
    '<div>' + esc(c.result) + '</div>' +
    (TYPE_ACK[c.type] ? '<div class="ack">' + esc(TYPE_ACK[c.type]) + '</div>' : '') +
    '</div>' +
    (s.followUp ? '<button class="btn btn-main" onclick="showFollow()">그다음에는</button>'
                : nextButton());
}
function nextButton(){
  var 마지막 = (현재 + 1 >= 순서.length);
  return '<button class="btn btn-main" onclick="' + (마지막 ? 'showWrap()' : 'nextSit()') + '">' +
         (마지막 ? '내 선택 모아 보기' : '다음 상황') + '</button>';
}
function showFollow(){
  var s = 상황목록[순서[현재]];
  var f = s.followUp;
  $('sit-after').innerHTML =
    '<div class="scene">' + f.scene + '</div>' +
    '<p style="font-size:15px;font-weight:700">' + esc(f.q) + '</p>' +
    f.options.map(function(o, i){
      return '<button class="choice" onclick="chooseFollow(' + i + ')">' + esc(o.text) + '</button>';
    }).join('');
  window.scrollTo(0, document.body.scrollHeight);
}
function chooseFollow(i){
  var s = 상황목록[순서[현재]];
  var o = s.followUp.options[i];
  $('sit-after').innerHTML =
    '<div class="scene">' + s.followUp.scene + '</div>' +
    '<div class="choice" style="border-color:#7C3AED;background:#FAF9FF">' + esc(o.text) + '</div>' +
    '<div class="result positive">' + esc(o.result) + '</div>' + nextButton();
}
function nextSit(){ 현재++; drawSit(); window.scrollTo(0,0); }

function showWrap(){
  $('wrap-count').textContent = '상황 ' + 순서.length + '개를 풀었습니다.';
  $('wrap-tally').innerHTML = Object.keys(TYPE_LABELS).map(function(k){
    var T = TYPE_LABELS[k];
    return '<div><b style="color:' + T.color + '">' + (유형수[k]||0) + '</b><span>' + T.emoji + ' ' + esc(T.label) + '</span></div>';
  }).join('');
  var 최다 = Object.keys(유형수).sort(function(a,b){ return (유형수[b]||0)-(유형수[a]||0); })[0];
  $('wrap-msg').innerHTML = (유형수[최다] ? '<div class="result neutral">오늘 가장 많이 고른 것은 <b>' +
    esc(TYPE_LABELS[최다].label) + '</b>입니다. ' + esc(TYPE_ACK[최다] || '') + '</div>' : '');
  go('wrap');
}

async function submitPlan(){
  var plan = $('my-plan').value.trim();
  if (!plan) { toast('다음에 어떻게 할지 한 줄 써 주세요'); return; }
  내다짐 = { nick: 닉네임, types: Object.assign({}, 유형수), plan: plan, doneAt: Date.now() };
  if (방코드) await save(방코드, 닉네임, 내다짐);
  $('done-title').textContent = CONFIG.마무리말;
  $('done-body').innerHTML = '<div class="result positive">' + esc(plan) + '</div>';
  go('done');
}
function copyMine(){
  if (!내다짐) { toast('먼저 다짐을 내 주세요'); return; }
  var t = Object.keys(TYPE_LABELS).map(function(k){ return TYPE_LABELS[k].label + ' ' + (내다짐.types[k]||0); }).join(', ');
  copy('선택 앞에서 행동 조절하기\n' + t + '\n다짐: ' + 내다짐.plan);
}

/* 교사 대시보드 */
function reopenDash(){
  var c = $('in-dash').value.trim();
  if (!/^[0-9]{6}$/.test(c)) { toast('방 코드 6자리를 숫자로 입력해 주세요'); return; }
  방코드 = c; openDash();
}
function openDash(){
  $('dash-code').textContent = 방코드;
  go('dash');
  ready.then(function(){
    if (!online){ $('dash-rows').innerHTML = '<p class="sub">연결이 안 되어 이 기기 기록만 보입니다.</p>'; return; }
    onSnapshot(studentCol(방코드), function(snap){
      학생들 = {};
      snap.forEach(function(d){ 학생들[d.id] = d.data(); });
      drawDash();
    });
  });
}
function drawDash(){
  var list = Object.keys(학생들).map(function(k){ return 학생들[k]; });
  var done = list.filter(function(s){ return s.doneAt; });
  $('n-join').textContent = list.length;
  $('n-done').textContent = done.length;

  var sum = {};
  Object.keys(TYPE_LABELS).forEach(function(k){ sum[k] = 0; });
  done.forEach(function(s){ Object.keys(sum).forEach(function(k){ sum[k] += (s.types && s.types[k]) || 0; }); });
  var max = Math.max.apply(null, Object.keys(sum).map(function(k){ return sum[k]; }).concat([1]));
  $('dash-bars').innerHTML = Object.keys(TYPE_LABELS).map(function(k){
    var T = TYPE_LABELS[k];
    return '<div class="bar"><span style="width:110px">' + T.emoji + ' ' + esc(T.label) + '</span>' +
      '<i style="width:' + Math.round(sum[k]/max*150) + 'px;background:' + T.color + '"></i><span>' + sum[k] + '</span></div>';
  }).join('');
  $('dash-rows').innerHTML = done.length
    ? done.map(function(s){ return '<div class="row"><b>' + esc(s.nick) + '</b><br>' + esc(s.plan) + '</div>'; }).join('')
    : '<p class="sub">아직 제출한 다짐이 없습니다.</p>';
}
function copyAll(){
  var done = Object.keys(학생들).map(function(k){ return 학생들[k]; }).filter(function(s){ return s.doneAt; });
  if (!done.length) { toast('복사할 기록이 없습니다'); return; }
  copy('방 ' + 방코드 + ' · ' + done.length + '명\n\n' +
    done.map(function(s){
      var t = Object.keys(TYPE_LABELS).map(function(k){ return (s.types && s.types[k]) || 0; }).join('/');
      return [s.nick, t, s.plan].join('\t');
    }).join('\n'));
}
function copy(text){
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(function(){ toast('복사했습니다'); }, function(){ fallback(text); });
  else fallback(text);
}
function fallback(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('복사했습니다'); }
  catch(e){ window.prompt('직접 복사하세요 (Ctrl+C)', text); }
  document.body.removeChild(ta);
}

/* 시작 */
$('t-title').textContent = CONFIG.제목;
$('t-sub').textContent = CONFIG.부제;
$('t-meta').textContent = CONFIG.학년 + ' · 약 ' + CONFIG.소요시간;
document.title = CONFIG.제목;

Object.assign(window, { go:go, home:home, solo:solo, restart:restart, joinRoom:joinRoom,
  choose:choose, showFollow:showFollow, chooseFollow:chooseFollow, nextSit:nextSit,
  showWrap:showWrap, submitPlan:submitPlan, copyMine:copyMine,
  openDash:openDash, reopenDash:reopenDash, copyAll:copyAll });
console.log('[SEL] ' + CONFIG.제목 + ' 간소화판 ready (상황 ' + 상황목록.length + '개)');
</script>
