<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 강점과 가능성 찾기</title>
<style>
:root{--main:#7C3AED;--bg:#F5F3FF;--text:#1F2937;--dim:#6B7280;--gold:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:16px}
.wrap{max-width:560px;margin:0 auto}
.screen{display:none}.screen.on{display:block}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(124,58,237,.08)}
h1{font-size:25px;color:var(--main);text-align:center;margin-bottom:6px}
h2{font-size:20px;color:var(--main);margin-bottom:10px}
h3{font-size:16px;margin-bottom:8px}
p.sub{text-align:center;color:var(--dim);font-size:15px;margin-bottom:12px}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-main{background:var(--main);color:#fff}
.btn-sub{background:#EDE9FE;color:var(--main)}
.btn-line{background:#fff;color:var(--dim);border:1px solid #E5E7EB;font-size:14px;padding:9px;width:auto;display:inline-block;margin-right:6px}
input,textarea{width:100%;padding:12px;border:1px solid #DDD6FE;border-radius:10px;font-size:15px;font-family:inherit;margin:6px 0 12px}
textarea{min-height:62px;resize:vertical}
label{font-size:15px;font-weight:700}
.situation{background:#FAFAFA;border-left:4px solid var(--main);border-radius:10px;padding:14px;font-size:15px;white-space:pre-line;margin:10px 0}
.choice{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:2px solid #E5E7EB;border-radius:12px;background:#fff;font-size:15px;font-family:inherit;cursor:pointer;line-height:1.6}
.choice:hover{border-color:var(--main);background:#FAF9FF}
.got{background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:14px;margin-top:10px;font-size:15px}
.got b{color:#B45309}
.strengths{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tag{padding:8px 13px;border-radius:999px;background:#F5F3FF;border:1px solid #DDD6FE;color:var(--main);font-size:14px;font-weight:700}
.tag i{font-style:normal;opacity:.6;font-size:12px;margin-left:4px}
.sdesc{border-left:3px solid #DDD6FE;padding-left:12px;margin:10px 0;font-size:15px}
.sdesc b{color:var(--main)}
.note{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:12px;padding:12px;font-size:14px;margin-top:12px}
.stat{display:flex;justify-content:space-around;text-align:center;margin:12px 0}
.stat b{display:block;font-size:30px;color:var(--main)}
.stat span{font-size:13px;color:var(--dim)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.bar i{display:block;height:16px;background:var(--main);border-radius:4px;font-style:normal}
.row{border-bottom:1px solid #F3F4F6;padding:10px 0;font-size:14px}
.row b{color:var(--main)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.top{margin-bottom:10px}
.step{font-size:13px;color:var(--dim);text-align:right}
</style>
</head>
<body>
<div class="wrap">

  <!-- 1. 시작 -->
  <section class="screen on" id="s-start">
    <div class="card">
      <h1 id="t-title"></h1>
      <p class="sub" id="t-sub"></p>
      <p class="sub" id="t-meta"></p>
      <button class="btn btn-main" onclick="go('teacher')">방 만들기 (선생님)</button>
      <button class="btn btn-sub" onclick="go('student')">방 코드로 참여하기 (학생)</button>
      <button class="btn btn-sub" onclick="solo()">혼자 해보기</button>
      <div class="note">정답이 없는 활동입니다. 무엇을 고르든 그 안에 강점이 들어 있습니다.</div>
      <p class="sub" id="db-state" style="font-size:13px;margin:10px 0 0">저장소 확인 중</p>
    </div>
  </section>

  <!-- 2. 방 입장 -->
  <section class="screen" id="s-join">
    <div class="card">
      <h2 id="join-title"></h2>
      <div id="join-teacher" style="display:none">
        <p class="sub">아래 방 코드를 칠판에 적어 주세요.</p>
        <h1 id="new-code" style="font-size:44px;letter-spacing:6px"></h1>
        <button class="btn btn-main" onclick="openDash()">대시보드 열기</button>
        <p class="sub" style="margin-top:18px">지난 시간에 만든 방을 다시 열려면</p>
        <input id="in-dash" inputmode="numeric" maxlength="6" placeholder="예: 482913">
        <button class="btn btn-sub" onclick="reopenDash()">그 방 대시보드 열기</button>
      </div>
      <div id="join-student" style="display:none">
        <label>방 코드 (6자리)</label>
        <input id="in-code" inputmode="numeric" maxlength="6" placeholder="예: 482913">
        <label>닉네임 (실명 말고)</label>
        <input id="in-nick" maxlength="10" placeholder="예: 파랑새7">
        <button class="btn btn-main" onclick="joinRoom()">들어가기</button>
      </div>
      <button class="btn btn-line" onclick="home()">처음으로</button>
    </div>
  </section>

  <!-- 3. 거울 마을 -->
  <section class="screen" id="s-room">
    <div class="top"><button class="btn btn-line" onclick="home()">처음으로</button><span class="step" id="step-label"></span></div>
    <div class="card">
      <h2 id="room-name"></h2>
      <div class="situation" id="room-situation"></div>
      <div id="room-choices"></div>
      <div id="room-after"></div>
    </div>
  </section>

  <!-- 4. 강점 카드 -->
  <section class="screen" id="s-card">
    <div class="card">
      <h2>나의 강점 카드</h2>
      <p class="sub" id="card-count"></p>
      <div class="strengths" id="card-tags"></div>
      <div id="card-desc"></div>
      <h3 style="margin-top:16px">이 강점을 어디에 써 볼까요?</h3>
      <textarea id="my-use" placeholder="예: 모둠에서 이야기가 엉킬 때 내 경청을 써서 친구 말을 먼저 들어 주기"></textarea>
      <button class="btn btn-main" onclick="submitCard()">강점 카드 내기</button>
      <button class="btn btn-line" onclick="restart()">다른 방 다시 돌기</button>
    </div>
  </section>

  <!-- 5. 완료 -->
  <section class="screen" id="s-done">
    <div class="card" style="text-align:center">
      <h2 id="done-title"></h2>
      <div id="done-body" style="text-align:left"></div>
      <button class="btn btn-sub" onclick="copyMine()">내 강점 카드 복사하기</button>
      <button class="btn btn-line" onclick="restart()">다시 돌기</button>
      <button class="btn btn-line" onclick="home()">처음으로</button>
    </div>
  </section>

  <!-- 6. 교사 대시보드 -->
  <section class="screen" id="s-dash">
    <div class="card">
      <h2>교사 대시보드</h2>
      <p class="sub">방 코드 <b id="dash-code"></b></p>
      <div class="stat"><div><b id="n-join">0</b><span>참여</span></div><div><b id="n-done">0</b><span>카드 제출</span></div></div>
      <h3>우리 반에 많은 강점</h3><div id="dash-bars"></div>
      <h3 style="margin-top:16px">제출한 강점 카드</h3><div id="dash-rows"></div>
      <button class="btn btn-sub" onclick="copyAll()">전체 결과 복사하기</button>
      <button class="btn btn-line" onclick="home()">처음으로</button>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

/* ═══════════════════════════════════════════════
   여기만 고치면 우리 반 앱이 됩니다
   ═══════════════════════════════════════════════ */
const CONFIG = {
  제목: '나의 강점과 가능성 찾기',
  부제: '거울 마을의 방을 돌면서, 내 안에 있던 힘의 이름을 찾아봅니다',
  학년: '초등 4학년',
  소요시간: '15~20분',
  돌아볼방수: 6,       // 아래 ROOMS 12개 중 몇 개를 돌지. 12로 바꾸면 전부 돕니다
  방순서섞기: true,    // false 로 두면 적힌 순서대로 나옵니다
  마무리말: '내 강점을 찾았어요'
};

/* 거울 마을의 방들.

      choices:[

      choices:[
        {icon:'💪',text:'"해볼 거야!" 하고 계속 도전해요',strengths:['끈기','도전정신']},
        {icon:'🤔',text:'잠깐 멈추고 다른 방법을 생각해요',strengths:['전략적사고','유연성']},

        {icon:'🔧',text:'예전에 만들던 걸 더 멋지게 발전시켜요',strengths:['완성력','깊이추구']}
      ]},
    { id:'rest', icon:'🌿', name:'쉼의 방',

        {icon:'💭',text:'머릿속으로 이것저것 상상해봐요',strengths:['상상력','사색력']}
      ]},
    { id:'heart', icon:'💖', name:'마음의 방',
      situation:'친구가 슬퍼 보여요.\n무슨 일인지는 모르지만, 기운이 없어 보여요.\n나는 이럴 때...',
      choices:[

        {icon:'🎁',text:'좋아하는 걸 가져다줘요',strengths:['배려','실천적돌봄']},

      ]},
    { id:'wait', icon:'⏰', name:'기다림의 방',
      situation:'시간이 오래 걸리는 일이 있어요.\n식물 키우기, 긴 프로젝트, 어려운 기술 배우기...\n나는 이럴 때...',

/* 상태 */
var 방코드 = '', 닉네임 = '', 학생들 = {}, 내카드 = null;
var 순서 = [], 현재 = 0, 모은강점 = [];

function $(id){ return document.getElementById(id); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(function(){ t.classList.remove('on'); }, 1600); }

function go(name){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('on'); });
  if (name === 'teacher' || name === 'student'){
    $('s-join').classList.add('on');
    $('join-title').textContent = (name === 'teacher') ? '방 만들기' : '방 코드로 참여하기';
    $('join-teacher').style.display = (name === 'teacher') ? 'block' : 'none';
    $('join-student').style.display = (name === 'student') ? 'block' : 'none';
    if (name === 'teacher'){ 방코드 = String(Math.floor(Math.random()*900000+100000)); $('new-code').textContent = 방코드; }
    window.scrollTo(0,0); return;
  }
  var map = { start:'s-start', room:'s-room', card:'s-card', done:'s-done', dash:'s-dash' };
  $(map[name]).classList.add('on');
  window.scrollTo(0,0);
}
function home(){ go('start'); }

function 시작하기(){
  순서 = ROOMS.map(function(_, i){ return i; });
  if (CONFIG.방순서섞기){
    for (var i = 순서.length - 1; i > 0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = 순서[i]; 순서[i] = 순서[j]; 순서[j] = t;
    }
  }
  순서 = 순서.slice(0, Math.max(1, Math.min(CONFIG.돌아볼방수, ROOMS.length)));
  현재 = 0; 모은강점 = [];
  drawRoom();
  go('room');
}
function solo(){ 방코드 = ''; 닉네임 = '나'; 시작하기(); }
function restart(){ 시작하기(); }

async function joinRoom(){
  var c = $('in-code').value.trim(), n = $('in-nick').value.trim();
  if (!/^[0-9]{6}$/.test(c)) { toast('방 코드 6자리를 숫자로 입력해 주세요'); return; }
  if (!n) { toast('닉네임을 입력해 주세요'); return; }
  방코드 = c; 닉네임 = n;
  await save(c, n, { nick:n, joinedAt: Date.now() });
  시작하기();
}

/* 거울 마을 */
function drawRoom(){
  var r = ROOMS[순서[현재]];
  $('step-label').textContent = (현재+1) + ' / ' + 순서.length + '번째 방';
  $('room-name').textContent = r.icon + ' ' + r.name;
  $('room-situation').textContent = r.situation;
  $('room-after').innerHTML = '';
  $('room-choices').innerHTML = r.choices.map(function(c, i){
    return '<button class="choice" onclick="choose(' + i + ')">' + c.icon + ' ' + esc(c.text) + '</button>';
  }).join('');
}
function choose(i){
  var r = ROOMS[순서[현재]];
  var c = r.choices[i];
  c.strengths.forEach(function(s){ if (모은강점.indexOf(s) < 0) 모은강점.push(s); });
  $('room-choices').innerHTML = '<div class="choice" style="border-color:#7C3AED;background:#FAF9FF">' + c.icon + ' ' + esc(c.text) + '</div>';
  var 마지막 = (현재 + 1 >= 순서.length);
  $('room-after').innerHTML =
    '<div class="got"><b>이 선택에 담긴 힘</b><div class="strengths">' +
    c.strengths.map(function(s){ return '<span class="tag">' + esc(s) + '</span>'; }).join('') + '</div></div>' +
    '<button class="btn btn-main" onclick="' + (마지막 ? 'showCard()' : 'nextRoom()') + '">' +
    (마지막 ? '내 강점 카드 보기' : '다음 방으로') + '</button>';
}
function nextRoom(){ 현재++; drawRoom(); window.scrollTo(0,0); }

function showCard(){
  $('card-count').textContent = '방 ' + 순서.length + '개를 돌며 강점 ' + 모은강점.length + '개를 모았습니다.';
  $('card-tags').innerHTML = 모은강점.map(function(s){ return '<span class="tag">' + esc(s) + '</span>'; }).join('');
  $('card-desc').innerHTML = 모은강점.map(function(s){
    var d = STRENGTH_MESSAGES[s];
    return d ? '<div class="sdesc"><b>' + esc(s) + '</b><br>' + esc(d) + '</div>' : '';
  }).join('');
  go('card');
}

  var use = $('my-use').value.trim();
  if (!모은강점.length) { toast('먼저 방을 돌아 강점을 모아 주세요'); return; }
  if (!use) { toast('이 강점을 어디에 쓸지 한 줄 써 주세요'); return; }
  내카드 = { nick: 닉네임, strengths: 모은강점.slice(), use: use, doneAt: Date.now() };
  if (방코드) await save(방코드, 닉네임, 내카드);
  $('done-title').textContent = CONFIG.마무리말;
  $('done-body').innerHTML =
    '<div class="strengths">' + 모은강점.map(function(s){ return '<span class="tag">' + esc(s) + '</span>'; }).join('') + '</div>' +
    '<div class="sdesc"><b>어디에 쓸까</b><br>' + esc(use) + '</div>';
  go('done');
}
function copyMine(){
  if (!내카드) { toast('먼저 강점 카드를 내 주세요'); return; }
  copy('나의 강점 카드\n강점: ' + 내카드.strengths.join(', ') + '\n어디에 쓸까: ' + 내카드.use);
}

/* 교사 대시보드 */
function reopenDash(){
  var c = $('in-dash').value.trim();
  if (!/^[0-9]{6}$/.test(c)) { toast('방 코드 6자리를 숫자로 입력해 주세요'); return; }
  방코드 = c; openDash();
}
function openDash(){
  $('dash-code').textContent = 방코드;
  go('dash');
  ready.then(function(){
    if (!online){ $('dash-rows').innerHTML = '<p class="sub">연결이 안 되어 이 기기 기록만 보입니다.</p>'; return; }
    onSnapshot(studentCol(방코드), function(snap){
      학생들 = {};
      snap.forEach(function(d){ 학생들[d.id] = d.data(); });
      drawDash();
    });
  });
}
function drawDash(){
  var list = Object.keys(학생들).map(function(k){ return 학생들[k]; });
  var done = list.filter(function(s){ return s.doneAt; });
  $('n-join').textContent = list.length;
  $('n-done').textContent = done.length;

  var freq = {};
  done.forEach(function(s){ (s.strengths||[]).forEach(function(w){ freq[w] = (freq[w]||0)+1; }); });
  var top = Object.keys(freq).map(function(k){ return [k, freq[k]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,10);
  var max = top.length ? top[0][1] : 1;
  $('dash-bars').innerHTML = top.length
    ? top.map(function(p){ return '<div class="bar"><span style="width:100px">' + esc(p[0]) + '</span><i style="width:' + Math.round(p[1]/max*150) + 'px"></i><span>' + p[1] + '</span></div>'; }).join('')
    : '<p class="sub">아직 모은 강점이 없습니다.</p>';
  $('dash-rows').innerHTML = done.length
    ? done.map(function(s){ return '<div class="row"><b>' + esc(s.nick) + '</b><br>강점: ' + esc((s.strengths||[]).join(', ')) +
        '<br>쓸 곳: ' + esc(s.use) + '</div>'; }).join('')
    : '<p class="sub">아직 제출한 카드가 없습니다.</p>';
}
function copyAll(){
  var done = Object.keys(학생들).map(function(k){ return 학생들[k]; }).filter(function(s){ return s.doneAt; });
  if (!done.length) { toast('복사할 기록이 없습니다'); return; }
  copy('방 ' + 방코드 + ' · ' + done.length + '명\n\n' +
    done.map(function(s){ return [s.nick, (s.strengths||[]).join(' '), s.use].join('\t'); }).join('\n'));
}
function copy(text){
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(function(){ toast('복사했습니다'); }, function(){ fallback(text); });
  else fallback(text);
}
function fallback(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('복사했습니다'); }
  catch(e){ window.prompt('직접 복사하세요 (Ctrl+C)', text); }
  document.body.removeChild(ta);
}

/* 시작 */
$('t-title').textContent = CONFIG.제목;
$('t-sub').textContent = CONFIG.부제;
$('t-meta').textContent = CONFIG.학년 + ' · 약 ' + CONFIG.소요시간;
document.title = CONFIG.제목;

Object.assign(window, { go:go, home:home, solo:solo, restart:restart, joinRoom:joinRoom,
  choose:choose, nextRoom:nextRoom, showCard:showCard, submitCard:submitCard, copyMine:copyMine,
  openDash:openDash, reopenDash:reopenDash, copyAll:copyAll });
console.log('[SEL] ' + CONFIG.제목 + ' 간소화판 ready (방 ' + ROOMS.length + '개, 강점 설명 ' + Object.keys(STRENGTH_MESSAGES).length + '개)');
</script>
</body>
