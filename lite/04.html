<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화가 날 때, 멈추는 연습</title>
<style>
:root{--main:#7C3AED;--bg:#F5F3FF;--text:#1F2937;--dim:#6B7280;--hot:#EF4444;--warm:#F59E0B;--cool:#10B981}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:16px}
.wrap{max-width:560px;margin:0 auto}
.screen{display:none}.screen.on{display:block}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(124,58,237,.08)}
h1{font-size:25px;color:var(--main);text-align:center;margin-bottom:6px}
h2{font-size:20px;color:var(--main);margin-bottom:10px}
h3{font-size:16px;margin:14px 0 8px}
p.sub{text-align:center;color:var(--dim);font-size:15px;margin-bottom:12px}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-main{background:var(--main);color:#fff}
.btn-sub{background:#EDE9FE;color:var(--main)}
.btn-stop{background:var(--cool);color:#fff}
.btn-line{background:#fff;color:var(--dim);border:1px solid #E5E7EB;font-size:14px;padding:9px;width:auto;display:inline-block;margin-right:6px}
input,textarea{width:100%;padding:12px;border:1px solid #DDD6FE;border-radius:10px;font-size:15px;font-family:inherit;margin:6px 0 12px}
textarea{min-height:62px;resize:vertical}
label{font-size:15px;font-weight:700}
.gauge{height:20px;border-radius:999px;background:#F3F4F6;overflow:hidden;margin:10px 0 4px}
.gauge i{display:block;height:100%;border-radius:999px;transition:width .5s;font-style:normal}
.temp{font-size:14px;font-weight:700;text-align:right}
.story{background:#FAFAFA;border-left:4px solid var(--main);border-radius:10px;padding:14px;font-size:15px;margin:10px 0}
.emotion{font-size:15px;font-weight:700;color:var(--hot);margin:8px 0}
.choice{display:block;width:100%;text-align:left;padding:13px;margin:7px 0;border:2px solid #E5E7EB;border-radius:12px;background:#fff;font-size:15px;font-family:inherit;cursor:pointer;line-height:1.5}
.choice:hover{border-color:var(--main);background:#FAF9FF}
.choice small{display:block;font-size:13px;color:var(--dim)}
.guide{background:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;padding:14px;font-size:15px;margin:10px 0}
.boom{background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;padding:14px;font-size:15px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:9px 13px;border-radius:999px;border:2px solid #E5E7EB;background:#fff;font-size:14px;font-family:inherit;cursor:pointer;font-weight:700}
.chip.on{border-color:var(--main);background:#F5F3FF;color:var(--main)}
.note{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:12px;padding:12px;font-size:14px;margin-top:12px}
.stat{display:flex;justify-content:space-around;text-align:center;margin:12px 0}
.stat b{display:block;font-size:30px;color:var(--main)}
.stat span{font-size:13px;color:var(--dim)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.bar i{display:block;height:16px;background:var(--main);border-radius:4px;font-style:normal}
.row{border-bottom:1px solid #F3F4F6;padding:10px 0;font-size:14px}
.row b{color:var(--main)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.top{margin-bottom:10px}
.step{font-size:13px;color:var(--dim);text-align:right}
</style>
</head>
<body>
<div class="wrap">

  <!-- 1. 시작 -->
  <section class="screen on" id="s-start">
    <div class="card">
      <h1 id="t-title"></h1>
      <p class="sub" id="t-sub"></p>
      <p class="sub" id="t-meta"></p>
      <button class="btn btn-main" onclick="go('teacher')">방 만들기 (선생님)</button>
      <button class="btn btn-sub" onclick="go('student')">방 코드로 참여하기 (학생)</button>
      <button class="btn btn-sub" onclick="solo()">혼자 해보기</button>
      <div class="note">화를 참는 연습이 아니라, 터지기 전에 멈추는 연습입니다.</div>
      <p class="sub" id="db-state" style="font-size:13px;margin:10px 0 0">저장소 확인 중</p>
    </div>
  </section>

  <!-- 2. 방 입장 -->
  <section class="screen" id="s-join">
    <div class="card">
      <h2 id="join-title"></h2>
      <div id="join-teacher" style="display:none">
        <p class="sub">아래 방 코드를 칠판에 적어 주세요.</p>
        <h1 id="new-code" style="font-size:44px;letter-spacing:6px"></h1>
        <button class="btn btn-main" onclick="openDash()">대시보드 열기</button>
        <p class="sub" style="margin-top:18px">지난 시간에 만든 방을 다시 열려면</p>
        <input id="in-dash" inputmode="numeric" maxlength="6" placeholder="예: 482913">
        <button class="btn btn-sub" onclick="reopenDash()">그 방 대시보드 열기</button>
      </div>
      <div id="join-student" style="display:none">
        <label>방 코드 (6자리)</label>
        <input id="in-code" inputmode="numeric" maxlength="6" placeholder="예: 482913">
        <label>닉네임 (실명 말고)</label>
        <input id="in-nick" maxlength="10" placeholder="예: 파랑새7">
        <button class="btn btn-main" onclick="joinRoom()">들어가기</button>
      </div>
      <button class="btn btn-line" onclick="home()">처음으로</button>
    </div>
  </section>

  <!-- 3. 인물 고르기 -->
  <section class="screen" id="s-pick">
    <div class="top"><button class="btn btn-line" onclick="home()">처음으로</button><span id="who" style="font-size:14px;color:#6B7280"></span></div>
    <div class="card">
      <h2>누구의 하루를 따라가 볼까요</h2>
      <p class="sub">하루 동안 화가 어떻게 쌓이는지 지켜보고, 터지기 전에 멈춰 보세요.</p>
      <div id="hero-list"></div>
    </div>
  </section>

  <!-- 4. 에피소드 -->
  <section class="screen" id="s-play">
    <div class="top"><button class="btn btn-line" onclick="go('pick')">인물 다시 고르기</button><span class="step" id="step-label"></span></div>
    <div class="card">
      <div class="gauge"><i id="gauge-fill" style="width:0%"></i></div>
      <div class="temp" id="temp-label">화 온도 0도</div>
      <h3 id="ep-title"></h3>
      <div class="story" id="ep-story"></div>
      <div class="emotion" id="ep-emotion"></div>
      <div id="ep-actions"></div>
    </div>
  </section>

  <!-- 5. 브레이크 -->
  <section class="screen" id="s-brake">
    <div class="card">
      <h2 id="brake-head">브레이크 걸기</h2>
      <div id="brake-body"></div>
    </div>
  </section>

  <!-- 6. 나의 브레이크 -->
  <section class="screen" id="s-mine">
    <div class="card">
      <h2>나의 브레이크 정하기</h2>
      <h3>나는 이럴 때 화가 나요</h3>
      <div class="chips" id="anger-chips"></div>
      <h3>그때 걸 브레이크</h3>
      <div class="chips" id="mybrake-chips"></div>
      <h3>내 브레이크를 한 문장으로</h3>
      <textarea id="my-one" placeholder="예: 놀림을 받아 욱할 때는 자리에서 일어나 물 한 모금 마시고 오기"></textarea>
      <button class="btn btn-main" onclick="submitMine()">내 브레이크 내기</button>
      <button class="btn btn-line" onclick="go('pick')">다른 인물도 보기</button>
    </div>
  </section>

  <!-- 7. 완료 -->
  <section class="screen" id="s-done">
    <div class="card" style="text-align:center">
      <h2 id="done-title"></h2>
      <div id="done-body" style="text-align:left"></div>
      <button class="btn btn-sub" onclick="copyMine()">내 브레이크 복사하기</button>
      <button class="btn btn-line" onclick="go('pick')">다른 인물도 보기</button>
      <button class="btn btn-line" onclick="home()">처음으로</button>
    </div>
  </section>

  <!-- 8. 교사 대시보드 -->
  <section class="screen" id="s-dash">
    <div class="card">
      <h2>교사 대시보드</h2>
      <p class="sub">방 코드 <b id="dash-code"></b></p>
      <div class="stat"><div><b id="n-join">0</b><span>참여</span></div><div><b id="n-done">0</b><span>브레이크 제출</span></div></div>
      <h3>우리 반이 화나는 순간</h3><div id="dash-anger"></div>
      <h3>많이 고른 브레이크</h3><div id="dash-brake"></div>
      <h3>제출한 브레이크</h3><div id="dash-rows"></div>
      <button class="btn btn-sub" onclick="copyAll()">전체 결과 복사하기</button>
      <button class="btn btn-line" onclick="home()">처음으로</button>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

/* ═══════════════════════════════════════════════
   여기만 고치면 우리 반 앱이 됩니다
   ═══════════════════════════════════════════════ */
const CONFIG = {
  제목: '화가 날 때, 멈추는 연습',
  부제: '화는 한 번에 터지지 않습니다. 하루 동안 조금씩 쌓입니다',
  학년: '초등 4학년',
  소요시간: '15~20분',
  폭발온도: 90,   // 화 온도가 이 값에 닿으면 터집니다
  마무리말: '내 브레이크를 정했어요'
};

/* 인물의 하루(에피소드), 브레이크 목록, 화가 나는 상황.
   story 와 emotion 문구를 우리 반 상황으로 바꿔 쓰면 됩니다.
   tempAdd 는 그 장면에서 화 온도가 얼마나 오르는지입니다. */
const EPISODES = [
    {
        id: 1, tempAdd: 15,
        title: '🌅 아침 — 늦잠의 시작',
        story: `민준이는 어젯밤 게임을 하다 늦게 잠들었어요. 아침에 알람이 울렸지만 꾸벅꾸벅... 눈을 떴더니 이미 8시 10분!<br><br>"아, 안돼! 지각이다!"<br><br>허겁지겁 일어나 세수도 제대로 못하고 옷을 입었어요. 아침밥도 못 먹고 현관문을 나서는데, 오늘따라 신발 끈이 자꾸 풀려요.`,
        emotion: '짜증이 나기 시작해요 😤'
    },
    {
        id: 2, tempAdd: 20,
        title: '🚌 등교길 — 겹치는 불운',
        story: `헐레벌떡 뛰어가는데 버스가 코앞에서 떠나버렸어요. 다음 버스까지 10분을 기다려야 해요.<br><br>비까지 부슬부슬 내리기 시작했는데... 우산이 없어요. 겨우 학교에 도착하니 머리카락이 축축해졌고, 지각이에요.<br><br>교실 문을 열자마자 친구들이 쳐다봐요.<br>선생님이 말씀하세요. "민준아, 또 지각이구나."`,
        emotion: '화가 올라오기 시작해요 😠'
    },
    {
        id: 3, tempAdd: 20,
        title: '📚 수업 시간 — 억울한 순간',
        story: `수학 시간, 짝꿍 현서가 민준이의 지우개를 물어보지도 않고 가져다 썼어요.<br><br>"야, 그거 내 거잖아!"<br><br>현서는 "잠깐 빌린 건데 뭐" 하며 돌려줬지만, 지우개가 까맣게 더러워져 있었어요. 게다가 선생님은 민준이가 떠든다고 주의만 주셨어요.<br><br><em>"나는 항의한 건데... 왜 나만 혼나?"</em>`,
        emotion: '억울하고 분한 마음이 커져요 😡'
    },
    {
        id: 4, tempAdd: 20,
        title: '🍽️ 점심시간 — 무시당한 기분',
        story: `점심 급식에 민준이가 제일 싫어하는 반찬만 나왔어요. 그래도 참고 먹으려는데...<br><br>친구들이 축구할 사람을 모으고 있었어요. 민준이가 "나도 낄래!" 했는데 은서가 말했어요.<br><br>"어... 이미 인원 다 찼는데?"<br><br>그런데 바로 뒤에 온 태윤이는 들어갔어요. 민준이만 빼고.`,
        emotion: '서럽고 화가 치밀어 올라요 🔥'
    },
    {
        id: 5, tempAdd: 15,
        title: '⏰ 방과 후 — 마지막 한 방',
        story: `하교 시간, 민준이는 교실 뒤에서 가방을 챙기고 있었어요. 그때 지나가던 승우가 장난으로 민준이 가방을 톡 쳤어요.<br><br>가방이 바닥에 떨어지며 필통이 열려서 연필과 지우개가 와르르 쏟아졌어요.<br><br>승우: "앗, 미안~ 일부러 그런 거 아니야!"<br><br>민준이의 손이 부르르 떨려요. 이가 꽉 물려요. 뭔가 터질 것 같은 순간...`,
        emotion: '💥 감정이 폭발 직전이에요!'
    }
];

const EPISODES_SEOYEON = [
    {
        id: 1, tempAdd: 15,
        title: '🎒 아침 — 사라진 준비물',
        story: `서연이는 어제 밤늦게까지 모둠 발표 자료를 만들었어요. 색종이로 오린 글자, 직접 그린 그림까지 정성껏 담은 봉투를 책상 위에 올려두고 잤죠.<br><br>그런데 아침에 보니 봉투가 없어요.<br><br>"엄마! 내 봉투 못 봤어?"<br>"어젯밤에 책상 정리했는데... 어디 뒀더라?"<br><br>겨우 찾았지만 봉투는 반쯤 구겨져 있었어요.`,
        emotion: '속상하고 조금 짜증이 나요 😔'
    },
    {
        id: 2, tempAdd: 20,
        title: '🧩 1교시 — 지나쳐진 내 의견',
        story: `모둠 회의 시간. 서연이가 손을 들고 말했어요.<br><br>"우리 발표를 퀴즈처럼 만들면 어때?"<br><br>아무도 대답하지 않았어요. 잠시 뒤 지호가 똑같은 말을 했어요.<br><br>"야, 퀴즈처럼 하면 재밌겠다!"<br>"오, 지호 아이디어 좋다!"<br><br>모두가 지호를 보며 고개를 끄덕였어요.`,
        emotion: '내 말이 없어진 것 같아 화가 올라와요 😠'
    },
    {
        id: 3, tempAdd: 20,
        title: '💬 쉬는 시간 — 등 뒤에서 들린 말',
        story: `물을 마시러 가는 길, 사물함 뒤에서 목소리가 들려왔어요.<br><br>"서연이는 왜 자꾸 자기 마음대로 하려고 해?"<br><br>서연이는 걸음을 멈췄어요. 심장이 쿵쾅거려요.<br><br>고개를 돌리자 말하던 친구가 얼른 입을 다물고 딴 데를 봐요.<br><br><em>"나는 그냥 잘하고 싶었을 뿐인데..."</em>`,
        emotion: '억울하고 서러운 마음이 커져요 😢'
    },
    {
        id: 4, tempAdd: 20,
        title: '🎨 미술 시간 — 망가진 작품',
        story: `발표 포스터에 마지막 색을 칠하고 있는데, 옆자리 친구가 팔을 휙 움직이다 물통을 쓰러뜨렸어요.<br><br>파란 물이 포스터 한가운데로 주르륵.<br><br>"어? 아 미안. 근데 어차피 거기 다시 칠하면 되잖아."<br><br>서연이가 세 시간 걸려 그린 부분이었어요. 손끝이 떨려요.`,
        emotion: '화가 확 치밀어 올라요 🔥'
    },
    {
        id: 5, tempAdd: 15,
        title: '📱 하교 전 — 단톡방의 웃음',
        story: `가방을 메고 나오는데 휴대폰이 울려요. 모둠 단톡방이에요.<br><br>누군가 서연이의 젖은 포스터 사진을 올렸어요.<br>그 아래로 웃음 이모티콘이 우르르 달렸어요. 😂😂😂<br><br>서연이는 화면을 꽉 쥐었어요. 얼굴이 확 달아오르고, 목이 뻐근해져요.<br><br>지금 당장 뭐라도 쓰고 싶은 순간...`,
        emotion: '💥 감정이 폭발 직전이에요!'
    }
];

const EPISODES_DOYUN = [
    {
        id: 1, tempAdd: 15,
        title: '🌤️ 아침 조회 — 갑자기 바뀐 순서',
        story: `오늘은 운동회 연습 날이에요. 도윤이는 일주일 내내 이어달리기 마지막 주자를 연습했어요.<br><br>그런데 아침 조회에서 선생님이 말씀하셨어요.<br><br>"오늘은 순서를 조금 바꿔볼게. 도윤이는 두 번째로 뛰자."<br><br>"네? 왜요?"<br>"이유는 이따 설명할게. 일단 준비하자."`,
        emotion: '이유를 몰라서 답답하고 서운해요 😕'
    },
    {

function 다중칩(host, items, 담는배열, 라벨){
  $(host).innerHTML = '';
  items.forEach(function(it){
    var b = document.createElement('button');
    b.className = 'chip';
    b.textContent = 라벨(it);
    b.onclick = function(){
      var i = 담는배열.indexOf(it.id);
      if (i >= 0) { 담는배열.splice(i,1); b.classList.remove('on'); }
      else { 담는배열.push(it.id); b.classList.add('on'); }
    };
    $(host).appendChild(b);
  });
}
function drawMine(){
  다중칩('anger-chips', ANGER_TYPES, 고른화, function(a){ return a.icon + ' ' + a.label; });
  다중칩('mybrake-chips', BRAKES, 고른브, function(b){ return b.icon + ' ' + b.name; });
}
async function submitMine(){
  var one = $('my-one').value.trim();
  if (!고른화.length) { toast('내가 화나는 순간을 하나 이상 골라 주세요'); return; }
  if (!고른브.length) { toast('그때 걸 브레이크를 하나 이상 골라 주세요'); return; }
  if (!one) { toast('내 브레이크를 한 문장으로 써 주세요'); return; }
  var 화이름 = 고른화.map(function(id){ var x = ANGER_TYPES.filter(function(v){return v.id===id;})[0]; return x ? x.label : id; });
  var 브이름 = 고른브.map(function(id){ var x = BRAKES.filter(function(v){return v.id===id;})[0]; return x ? x.name : id; });
  내브레이크 = { nick: 닉네임, angers: 화이름, brakes: 브이름, one: one, doneAt: Date.now() };
  if (방코드) await save(방코드, 닉네임, 내브레이크);
  $('done-title').textContent = CONFIG.마무리말;
  $('done-body').innerHTML =
    '<div class="story"><b>화가 나는 순간</b><br>' + esc(화이름.join(', ')) + '</div>' +
    '<div class="story"><b>걸 브레이크</b><br>' + esc(브이름.join(', ')) + '</div>' +
    '<div class="guide">' + esc(one) + '</div>';
  go('done');
}
function copyMine(){
  if (!내브레이크) { toast('먼저 브레이크를 내 주세요'); return; }
  copy('나의 브레이크\n화나는 순간: ' + 내브레이크.angers.join(', ') +
       '\n걸 브레이크: ' + 내브레이크.brakes.join(', ') + '\n한 문장: ' + 내브레이크.one);
}

/* 교사 대시보드 */
function reopenDash(){
  var c = $('in-dash').value.trim();
  if (!/^[0-9]{6}$/.test(c)) { toast('방 코드 6자리를 숫자로 입력해 주세요'); return; }
  방코드 = c; openDash();
}
function openDash(){
  $('dash-code').textContent = 방코드;
  go('dash');
  ready.then(function(){
    if (!online){ $('dash-rows').innerHTML = '<p class="sub">연결이 안 되어 이 기기 기록만 보입니다.</p>'; return; }
    onSnapshot(studentCol(방코드), function(snap){
      학생들 = {};
      snap.forEach(function(d){ 학생들[d.id] = d.data(); });
      drawDash();
    });
  });
}
function 막대(host, freq, 폭){
  var top = Object.keys(freq).map(function(k){ return [k, freq[k]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,8);
  var max = top.length ? top[0][1] : 1;
  $(host).innerHTML = top.length
    ? top.map(function(p){ return '<div class="bar"><span style="width:' + 폭 + 'px">' + esc(p[0]) + '</span><i style="width:' + Math.round(p[1]/max*140) + 'px"></i><span>' + p[1] + '</span></div>'; }).join('')
    : '<p class="sub">아직 기록이 없습니다.</p>';
}
function drawDash(){
  var list = Object.keys(학생들).map(function(k){ return 학생들[k]; });
  var done = list.filter(function(s){ return s.doneAt; });
  $('n-join').textContent = list.length;
  $('n-done').textContent = done.length;
  var fa = {}, fb = {};
  done.forEach(function(s){
    (s.angers||[]).forEach(function(n){ fa[n]=(fa[n]||0)+1; });
    (s.brakes||[]).forEach(function(n){ fb[n]=(fb[n]||0)+1; });
  });
  막대('dash-anger', fa, 130);
  막대('dash-brake', fb, 120);
  $('dash-rows').innerHTML = done.length
    ? done.map(function(s){ return '<div class="row"><b>' + esc(s.nick) + '</b><br>' + esc((s.angers||[]).join(', ')) +
        '<br>브레이크: ' + esc((s.brakes||[]).join(', ')) + '<br>' + esc(s.one) + '</div>'; }).join('')
    : '<p class="sub">아직 제출한 브레이크가 없습니다.</p>';
}
function copyAll(){
  var done = Object.keys(학생들).map(function(k){ return 학생들[k]; }).filter(function(s){ return s.doneAt; });
  if (!done.length) { toast('복사할 기록이 없습니다'); return; }
  copy('방 ' + 방코드 + ' · ' + done.length + '명\n\n' +
    done.map(function(s){ return [s.nick, (s.angers||[]).join(' '), (s.brakes||[]).join(' '), s.one].join('\t'); }).join('\n'));
}
function copy(text){
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(function(){ toast('복사했습니다'); }, function(){ fallback(text); });
  else fallback(text);
}
function fallback(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('복사했습니다'); }
  catch(e){ window.prompt('직접 복사하세요 (Ctrl+C)', text); }
  document.body.removeChild(ta);
}
