<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감정에도 이름이 있다</title>
<style>
:root{--main:#7C3AED;--bg:#F5F3FF;--text:#1F2937;--dim:#6B7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:16px}
.wrap{max-width:560px;margin:0 auto}
.screen{display:none}.screen.on{display:block}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(124,58,237,.08)}
h1{font-size:26px;color:var(--main);text-align:center;margin-bottom:6px}
h2{font-size:20px;color:var(--main);margin-bottom:10px}
h3{font-size:16px;margin-bottom:8px}
p.sub{text-align:center;color:var(--dim);font-size:15px;margin-bottom:12px}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-main{background:var(--main);color:#fff}
.btn-sub{background:#EDE9FE;color:var(--main)}
.btn-line{background:#fff;color:var(--dim);border:1px solid #E5E7EB;font-size:14px;padding:9px;width:auto;display:inline-block;margin-right:6px}
input,textarea{width:100%;padding:12px;border:1px solid #DDD6FE;border-radius:10px;font-size:15px;font-family:inherit;margin:6px 0 12px}
textarea{min-height:76px;resize:vertical}
label{font-size:15px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:10px 14px;border-radius:999px;border:2px solid #E5E7EB;background:#fff;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700}
.chip.on{border-color:var(--main);background:#F5F3FF;color:var(--main)}
.detail{background:#FAF9FF;border:1px solid #E9D5FF;border-radius:12px;padding:14px;margin-top:10px}
.detail dt{font-size:13px;color:var(--main);font-weight:700;margin-top:8px}
.detail dd{font-size:15px}
.note{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:12px;padding:12px;font-size:14px;margin-top:12px}
.stat{display:flex;justify-content:space-around;text-align:center;margin:12px 0}
.stat b{display:block;font-size:30px;color:var(--main)}
.stat span{font-size:13px;color:var(--dim)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.bar i{display:block;height:16px;background:var(--main);border-radius:4px;font-style:normal}
.row{border-bottom:1px solid #F3F4F6;padding:10px 0;font-size:14px}
.row b{color:var(--main)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.top{margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 1. 시작 -->
  <section class="screen on" id="s-start">
    <div class="card">
      <h1 id="t-title"></h1>
      <p class="sub" id="t-sub"></p>
      <p class="sub" id="t-meta"></p>
      <button class="btn btn-main" onclick="go('teacher')">방 만들기 (선생님)</button>
      <button class="btn btn-sub" onclick="go('student')">방 코드로 참여하기 (학생)</button>
      <button class="btn btn-sub" onclick="solo()">혼자 해보기</button>
      <div class="note">방 코드는 입장할 때만 쓰는 숫자입니다. 닉네임에 실명을 쓰지 마세요.</div>
      <p class="sub" id="db-state" style="font-size:13px;margin:10px 0 0">저장소 확인 중</p>
    </div>
  </section>

  <!-- 2. 방 입장 -->
  <section class="screen" id="s-join">
    <div class="card">
      <h2 id="join-title"></h2>
      <div id="join-teacher" style="display:none">
        <p class="sub">아래 방 코드를 칠판에 적어 주세요.</p>
        <h1 id="new-code" style="font-size:44px;letter-spacing:6px"></h1>
        <button class="btn btn-main" onclick="openDash()">대시보드 열기</button>
        <p class="sub" style="margin-top:18px">지난 시간에 만든 방을 다시 열려면</p>
        <input id="in-dash" inputmode="numeric" maxlength="6" placeholder="예: 482913">
        <button class="btn btn-sub" onclick="reopenDash()">그 방 대시보드 열기</button>
      </div>
      <div id="join-student" style="display:none">
        <label>방 코드 (6자리)</label>
        <input id="in-code" inputmode="numeric" maxlength="6" placeholder="예: 482913">
        <label>닉네임 (실명 말고)</label>
        <input id="in-nick" maxlength="10" placeholder="예: 파랑새7">
        <button class="btn btn-main" onclick="joinRoom()">들어가기</button>
      </div>
      <button class="btn btn-line" onclick="home()">처음으로</button>
    </div>
  </section>

  <!-- 3. 감정 탐험 -->
  <section class="screen" id="s-explore">
    <div class="top"><button class="btn btn-line" onclick="home()">처음으로</button><span id="who" style="font-size:14px;color:#6B7280"></span></div>
    <div class="card">
      <h2>감정 가계도</h2>
      <p class="sub">큰 감정을 누르면 그 안에 숨은 작은 감정이 나옵니다.</p>
      <div class="chips" id="lv1"></div>
      <div class="chips" id="lv2"></div>
      <div class="chips" id="lv3"></div>
      <div id="card-detail"></div>
    </div>
    <button class="btn btn-main" onclick="go('record')">감정 처방전 쓰러 가기</button>
  </section>

  <!-- 4. 감정 처방전 -->
  <section class="screen" id="s-record">
    <div class="card">
      <h2>나만의 감정 처방전</h2>
      <label id="q1"></label><input id="rx-name" placeholder="예: 서운함">
      <label id="q2"></label><textarea id="rx-when" placeholder="예: 쉬는 시간에 친구들이 나만 빼고 이야기했을 때"></textarea>
      <label id="q3"></label><textarea id="rx-care" placeholder="예: 숨을 길게 세 번 쉬고, 하고 싶은 말을 종이에 먼저 적어 보기"></textarea>
      <button class="btn btn-main" onclick="submitRx()">처방전 내기</button>
      <button class="btn btn-line" onclick="go('explore')">감정 더 보기</button>
    </div>
  </section>

  <!-- 5. 완료 -->
  <section class="screen" id="s-done">
    <div class="card" style="text-align:center">
      <h2 id="done-title"></h2>
      <div id="done-body" style="text-align:left"></div>
      <button class="btn btn-sub" onclick="copyMine()">내 처방전 복사하기</button>
      <button class="btn btn-line" onclick="go('explore')">감정 더 보기</button>
      <button class="btn btn-line" onclick="home()">처음으로</button>
    </div>
  </section>

  <!-- 6. 교사 대시보드 -->
  <section class="screen" id="s-dash">
    <div class="card">
      <h2>교사 대시보드</h2>
      <p class="sub">방 코드 <b id="dash-code"></b></p>
      <div class="stat"><div><b id="n-join">0</b><span>참여</span></div><div><b id="n-done">0</b><span>처방전 제출</span></div></div>
      <h3>우리 반이 고른 감정</h3><div id="dash-bars"></div>
      <h3 style="margin-top:16px">제출한 처방전</h3><div id="dash-rows"></div>
      <button class="btn btn-sub" onclick="copyAll()">전체 결과 복사하기</button>
      <button class="btn btn-line" onclick="home()">처음으로</button>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

/* 저장소 - 캔버스가 만들어 준 DB가 있으면 그것을 쓰고,
   없으면 emo-dex, 그것도 안 되면 이 기기에만 저장 */
const EMO_DEX = {
  apiKey:"AIzaSyCtaNdcziJ3uJK4p-KGbTGt39f1_1mNK2s", authDomain:"emo-dex.firebaseapp.com",
  projectId:"emo-dex", storageBucket:"emo-dex.firebasestorage.app",
  messagingSenderId:"994736049700", appId:"1:994736049700:web:8233fa7b68cd6e0cccd2b1"
};
const injected  = (typeof __firebase_config !== 'undefined' && __firebase_config) ? __firebase_config : null;
const fbConfig  = injected ? (typeof injected === 'string' ? JSON.parse(injected) : injected) : EMO_DEX;
const APP_ID    = (typeof __app_id !== 'undefined' && __app_id) ? __app_id : 'sel-lesson-02-lite';
const AUTH_TOKEN= (typeof __initial_auth_token !== 'undefined') ? __initial_auth_token : null;

let db = null, online = false, 저장소 = '';
const memory = {};

async function initDB(){
  try{
    const app = initializeApp(fbConfig);
    const auth = getAuth(app);
    db = getFirestore(app);
    await Promise.race([
      AUTH_TOKEN ? signInWithCustomToken(auth, AUTH_TOKEN) : signInAnonymously(auth),
      new Promise(function(_, rej){ setTimeout(function(){ rej('timeout'); }, 6000); })
    ]);
    online = true;
  }catch(e){ online = false; }
  저장소 = online ? (injected ? '캔버스 내장' : 'emo-dex') : '이 기기에만 (다른 기기와 수합 안 됨)';
  console.log('[DB] ' + 저장소);
  var el = document.getElementById('db-state');
  if (el) el.textContent = '저장소: ' + 저장소;
}
const ready = initDB();

function studentDoc(code, nick){ return doc(db, 'artifacts', APP_ID, 'public', 'data', 'rooms', code, 'students', nick); }
function studentCol(code){ return collection(db, 'artifacts', APP_ID, 'public', 'data', 'rooms', code, 'students'); }

async function save(code, nick, data){
  await ready;
  if (online){ try { await setDoc(studentDoc(code, nick), data, {merge:true}); return; } catch(e){} }
  memory[code] = memory[code] || {};
  memory[code][nick] = Object.assign({}, memory[code][nick], data);
}

/* 상태 */
var 방코드 = '', 닉네임 = '', 역할 = '', 고른감정 = '', 내처방 = null, 학생들 = {};
var 선택1 = '', 선택2 = '';

function $(id){ return document.getElementById(id); }
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(function(){ t.classList.remove('on'); }, 1600); }

function go(name){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('on'); });
  if (name === 'teacher' || name === 'student'){
    $('s-join').classList.add('on');
    역할 = name;
    $('join-title').textContent = (name === 'teacher') ? '방 만들기' : '방 코드로 참여하기';
    $('join-teacher').style.display = (name === 'teacher') ? 'block' : 'none';
    $('join-student').style.display = (name === 'student') ? 'block' : 'none';
    if (name === 'teacher'){ 방코드 = String(Math.floor(Math.random()*900000+100000)); $('new-code').textContent = 방코드; }
    window.scrollTo(0,0); return;
  }
  var map = { start:'s-start', explore:'s-explore', record:'s-record', done:'s-done', dash:'s-dash' };
  $(map[name]).classList.add('on');
  window.scrollTo(0,0);
}
function home(){ go('start'); }
function solo(){ 역할 = 'solo'; 방코드 = ''; 닉네임 = '나'; $('who').textContent = '혼자 해보기'; go('explore'); }

async function joinRoom(){
  var c = $('in-code').value.trim(), n = $('in-nick').value.trim();
  if (!/^[0-9]{6}$/.test(c)) { toast('방 코드 6자리를 숫자로 입력해 주세요'); return; }
  if (!n) { toast('닉네임을 입력해 주세요'); return; }
  방코드 = c; 닉네임 = n; 역할 = 'student';
  await save(c, n, { nick:n, joinedAt: Date.now() });
  $('who').textContent = 방코드 + '번 방 · ' + 닉네임;
  go('explore');
}

/* 감정 탐험 */
function chip(text, emoji, on, fn){
  var b = document.createElement('button');
  b.className = 'chip' + (on ? ' on' : '');
  b.textContent = emoji + ' ' + text;
  b.onclick = fn;
  return b;
}
function drawLv1(){
  var box = $('lv1'); box.innerHTML = '';
  Object.keys(EMOTIONS).forEach(function(name){
    box.appendChild(chip(name, EMOTIONS[name].emoji, 선택1 === name, function(){
      선택1 = name; 선택2 = '';
      drawLv1(); drawLv2(); $('lv3').innerHTML = ''; $('card-detail').innerHTML = '';
    }));
  });
}
function drawLv2(){
  var box = $('lv2'); box.innerHTML = '';
  if (!선택1) return;
  var 갈래 = EMOTIONS[선택1].갈래;
  Object.keys(갈래).forEach(function(name){
    box.appendChild(chip(name, 갈래[name].emoji, 선택2 === name, function(){
      선택2 = name; drawLv2(); drawLv3(); $('card-detail').innerHTML = '';
    }));
  });
}
function drawLv3(){
  var box = $('lv3'); box.innerHTML = '';
  if (!선택1 || !선택2) return;
  var 자녀 = EMOTIONS[선택1].갈래[선택2].자녀;
  Object.keys(자녀).forEach(function(name){
    box.appendChild(chip(name, 자녀[name].emoji, 고른감정 === name, function(){
      고른감정 = name; drawLv3(); showDetail(name, 자녀[name]);
    }));
  });
}
function showDetail(name, e){
  $('card-detail').innerHTML =
    '<div class="detail"><h3>' + e.emoji + ' ' + name + '</h3><dl>' +
    '<dt>어떤 느낌</dt><dd>' + e.느낌 + '</dd>' +
    '<dt>언제 드는 마음</dt><dd>' + e.언제 + '</dd>' +
    '<dt>몸에서 오는 신호</dt><dd>' + e.몸 + '</dd>' +
    '<dt>이럴 땐 이렇게</dt><dd>' + e.처방 + '</dd></dl></div>';
  if (방코드) save(방코드, 닉네임, { lastEmotion: name });
}

/* 처방전 */
async function submitRx(){
  var name = $('rx-name').value.trim(), when = $('rx-when').value.trim(), care = $('rx-care').value.trim();
  if (!name || !when || !care) { toast('세 칸을 모두 채워 주세요'); return; }
  내처방 = { emotion:name, when:when, care:care, doneAt: Date.now(), nick: 닉네임 };
  if (방코드) await save(방코드, 닉네임, 내처방);
  $('done-title').textContent = CONFIG.마무리말;
  $('done-body').innerHTML = '<div class="detail"><dl><dt>오늘의 감정</dt><dd>' + name +
    '</dd><dt>언제</dt><dd>' + when + '</dd><dt>나를 위한 처방</dt><dd>' + care + '</dd></dl></div>';
  go('done');
}
function copyMine(){
  if (!내처방) { toast('먼저 처방전을 내 주세요'); return; }
  copy('[' + 내처방.emotion + ']\n언제: ' + 내처방.when + '\n처방: ' + 내처방.care);
}

/* 교사 대시보드 */
function reopenDash(){
  var c = $('in-dash').value.trim();
  if (!/^[0-9]{6}$/.test(c)) { toast('방 코드 6자리를 숫자로 입력해 주세요'); return; }
  방코드 = c;
  openDash();
}
function openDash(){
  $('dash-code').textContent = 방코드;
  go('dash');
  ready.then(function(){
    if (!online){ $('dash-rows').innerHTML = '<p class="sub">연결이 안 되어 이 기기 기록만 보입니다.</p>'; return; }
    onSnapshot(studentCol(방코드), function(snap){
      학생들 = {};
      snap.forEach(function(d){ 학생들[d.id] = d.data(); });
      drawDash();
    });
  });
}
function drawDash(){
  var list = Object.keys(학생들).map(function(k){ return 학생들[k]; });
  var done = list.filter(function(s){ return s.doneAt; });
  $('n-join').textContent = list.length;
  $('n-done').textContent = done.length;

  var freq = {};
  list.forEach(function(s){ var k = s.emotion || s.lastEmotion; if (k) freq[k] = (freq[k]||0)+1; });
  var top = Object.keys(freq).map(function(k){ return [k, freq[k]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,8);
  var max = top.length ? top[0][1] : 1;
  $('dash-bars').innerHTML = top.length
    ? top.map(function(p){ return '<div class="bar"><span style="width:70px">' + p[0] + '</span><i style="width:' + Math.round(p[1]/max*180) + 'px"></i><span>' + p[1] + '</span></div>'; }).join('')
    : '<p class="sub">아직 고른 감정이 없습니다.</p>';
  $('dash-rows').innerHTML = done.length
    ? done.map(function(s){ return '<div class="row"><b>' + s.nick + '</b> · ' + s.emotion + '<br>언제: ' + s.when + '<br>처방: ' + s.care + '</div>'; }).join('')
    : '<p class="sub">아직 제출한 처방전이 없습니다.</p>';
}
function copyAll(){
  var done = Object.keys(학생들).map(function(k){ return 학생들[k]; }).filter(function(s){ return s.doneAt; });
  if (!done.length) { toast('복사할 기록이 없습니다'); return; }
  copy('방 ' + 방코드 + ' · ' + done.length + '명\n\n' +
    done.map(function(s){ return s.nick + '\t' + s.emotion + '\t' + s.when + '\t' + s.care; }).join('\n'));
}
function copy(text){
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(function(){ toast('복사했습니다'); }, function(){ fallback(text); });
  else fallback(text);
}
function fallback(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('복사했습니다'); }
  catch(e){ window.prompt('직접 복사하세요 (Ctrl+C)', text); }
  document.body.removeChild(ta);
}

/* 시작 */
$('t-title').textContent = CONFIG.제목;
$('t-sub').textContent = CONFIG.부제;
$('t-meta').textContent = CONFIG.학년 + ' · 약 ' + CONFIG.소요시간;
document.title = CONFIG.제목;
$('q1').textContent = CONFIG.처방전질문.감정;
$('q2').textContent = CONFIG.처방전질문.언제;
$('q3').textContent = CONFIG.처방전질문.처방;
drawLv1();

Object.assign(window, { go:go, home:home, solo:solo, joinRoom:joinRoom, submitRx:submitRx,
  copyMine:copyMine, openDash:openDash, reopenDash:reopenDash, copyAll:copyAll });
console.log('[SEL] ' + CONFIG.제목 + ' 간소화판 ready');
</script>
